<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>UrbanForma — Smart City Planning Platform</title>
    <meta
      name="description"
      content="UrbanForma — the smart city planning platform for GIS, 3D city modeling, environmental analysis and optimization."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 26V12l5-3v17M11 26V6l6-3v23M17 26V10l9 5v11' fill='none' stroke='%232563EB' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#F5F9FF" />

    <!--
      Inter is self-hosted as a single variable font (weights 100–900).
      This replaces the previous render-blocking Google Fonts stylesheet and
      its two third-party preconnects: no extra DNS/TCP/TLS handshake, no
      cross-origin request blocking first paint, and ~47 KB instead of five
      static weight files. Preloaded at the highest priority so the swap is
      invisible; `font-display: swap` guarantees text is never blocked.
    -->
    <link
      rel="preload"
      href="/fonts/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
